---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fileblock-controller
  namespace: fileblock-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fileblock-node
  namespace: fileblock-system
---
# Permissions required by external-provisioner v5 + external-resizer v1.11.
# csi-resizer's pod-aware mode runs a Pod informer at startup; without
# pods get/list/watch the informer fails on every list cycle and the
# resizer's control loop never processes PVC capacity changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fileblock-controller
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims/status]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fileblock-controller
subjects:
  - kind: ServiceAccount
    name: fileblock-controller
    namespace: fileblock-system
roleRef:
  kind: ClusterRole
  name: fileblock-controller
  apiGroup: rbac.authorization.k8s.io
---
# csi-node-driver-registrar needs to GET its own pod and list nodes. The
# failed-volume remediation additionally needs the pod, event and policy
# rules below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fileblock-node
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # Failed-volume remediation (--auto-delete-pod-when-volume-failed). The
  # delete is cluster-wide here; remediation-policy.yaml limits it to pods
  # on the caller's own node that a controller owns and that mount a PVC.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    resourceNames: [fileblock-node-pod-delete]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fileblock-node
subjects:
  - kind: ServiceAccount
    name: fileblock-node
    namespace: fileblock-system
roleRef:
  kind: ClusterRole
  name: fileblock-node
  apiGroup: rbac.authorization.k8s.io
